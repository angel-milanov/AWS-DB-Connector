name: Feature request
description: An idea that would make AWS DB Connector more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you are in and what stands in the way. This matters more than the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would help?
      description: How you imagine it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
